<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>TERMINAL</title>

<style>

/* =====================================================
   TERMINAL APPEARANCE
===================================================== */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #020402;
    color: #b7ffb7;

    font-family:
        "Courier New",
        Courier,
        monospace;

    overflow-x: hidden;

    text-shadow:
        0 0 5px rgba(100,255,100,0.35);

    transition:
        background 2s ease,
        color 2s ease;
}


/* CRT scanlines */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1000;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.025) 0px,
            rgba(255,255,255,0.025) 1px,
            transparent 1px,
            transparent 4px
        );
}


/* CRT darkness around edges */

body::after {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 999;

    box-shadow:
        inset 0 0 120px rgba(0,0,0,0.95);
}


/* =====================================================
   TERMINAL WINDOW
===================================================== */

.container {
    width: 92%;
    max-width: 850px;

    margin: 60px auto;
}

.box {

    background:
        rgba(0, 12, 0, 0.97);

    border:
        1px solid #386638;

    padding: 35px;

    box-shadow:
        0 0 25px rgba(60,255,60,0.05);

    animation:
        boot 0.7s ease;
}


@keyframes boot {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =====================================================
   TEXT
===================================================== */

h1 {

    font-size: 21px;

    font-weight: normal;

    letter-spacing: 3px;

    margin-top: 0;

}


p {

    line-height: 1.8;

    letter-spacing: 1px;

}


.progress {

    color: #568556;

    font-size: 12px;

    letter-spacing: 2px;

    margin-bottom: 30px;

}


.question {

    white-space: pre-line;

}


#questionText {

    line-height: 1.9;

}


/* =====================================================
   INPUTS
===================================================== */

input {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    margin-bottom: 20px;

    background:
        #000900;

    border:
        1px solid #386638;

    color:
        #b7ffb7;

    font-family:
        "Courier New",
        Courier,
        monospace;

    font-size: 15px;

    outline: none;

    text-shadow:
        0 0 5px rgba(100,255,100,0.35);

}


input:focus {

    border-color:
        #75ff75;

    box-shadow:
        0 0 12px
        rgba(70,255,70,0.12);

}


/* =====================================================
   BUTTONS
===================================================== */

button {

    width: 100%;

    padding: 14px;

    margin: 8px 0;

    background:
        #020a02;

    color:
        #9cff9c;

    border:
        1px solid #386638;

    font-family:
        "Courier New",
        Courier,
        monospace;

    cursor: pointer;

    text-align: left;

    transition:
        background 0.2s,
        border 0.2s;

}


button:hover {

    background:
        #092009;

    border-color:
        #75ff75;

}


/* Begin / Submit centered */

.mainButton {

    text-align: center;

    letter-spacing: 2px;

}


/* =====================================================
   STATES
===================================================== */

.hidden {
    display: none;
}


.error {

    color:
        #ff5555;

    margin-bottom:
        15px;

}


.warning {

    color:
        #ff4444;

    font-size:
        12px;

    letter-spacing:
        2px;

}


.red {

    color:
        #ff4444;

}


/* =====================================================
   CREEPY CORRUPTION
===================================================== */

.corruption {

    animation:
        flicker 0.13s infinite;

}


@keyframes flicker {

    0% {
        opacity: 1;
    }

    40% {
        opacity: 0.94;
    }

    50% {
        opacity: 0.72;
    }

    55% {
        opacity: 1;
    }

    100% {
        opacity: 0.96;
    }

}


/* =====================================================
   FINAL SCREEN
===================================================== */

.final {

    text-align:
        center;

}


.final-question {

    margin:
        45px 0;

    font-size:
        25px;

    line-height:
        2;

}


#typing {

    white-space:
        pre-line;

    line-height:
        2;

}


#sendStatus {

    margin-top:
        20px;

    font-size:
        12px;

}


.secret {

    color:
        #020402;

    font-size:
        8px;

    margin-top:
        30px;

    user-select:
        none;

}

</style>
</head>


<body>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="backgroundMusic"
    src="34. NORTHERNLIGHT (DELTARUNE Chapter 34 Soundtrack) - Toby Fox.mp3"
    loop>
</audio>


<div class="container">


<!-- =====================================================
     INTRO
===================================================== -->

<div
    class="box"
    id="intro">

    <h1>
        TERMINAL NO-01
    </h1>

    <p>
        SYSTEM INITIALIZED.
    </p>

    <p>
        ARCHIVE ACCESS REQUESTED.
    </p>

    <p>
        IDENTITY VERIFICATION REQUIRED.
    </p>

    <br>

    <label>
        ENTER EMAIL:
    </label>

    <input
        type="email"
        id="email"
        placeholder="user@email.com"
    >

    <div
        id="emailError"
        class="error hidden">

        ERROR:
        INVALID EMAIL ADDRESS.

    </div>

    <button
        class="mainButton"
        onclick="startTest()">

        [ BEGIN ]

    </button>

    <div class="secret">
        YOU WERE NOT SUPPOSED TO FIND THIS TERMINAL.
    </div>

</div>


<!-- =====================================================
     QUESTIONS
===================================================== -->

<div
    class="box hidden"
    id="quiz">


    <div
        class="progress"
        id="progress">

        TERMINAL NO-01

    </div>


    <div class="question">

        <h1 id="questionText"></h1>

        <div
            id="answers">
        </div>

    </div>


    <div
        id="message">
    </div>


</div>


<!-- =====================================================
     FINAL QUESTION
===================================================== -->

<div
    class="box hidden final"
    id="final">

    <h1>
        TERMINAL NO-04
    </h1>

    <p id="typing"></p>


    <div class="final-question">

        <span class="red">
            WHO DID IT?
        </span>

    </div>


    <input
        type="text"
        id="finalAnswer"
        placeholder="TYPE YOUR ANSWER..."
    >


    <button
        class="mainButton"
        onclick="submitFinal()">

        [ SUBMIT ]

    </button>


    <div
        id="sendStatus">
    </div>

</div>


<!-- =====================================================
     END
===================================================== -->

<div
    class="box hidden final"
    id="ending">

    <h1 id="endingTitle"></h1>

    <p id="endingText"></p>

</div>


</div>


<script>


/* =====================================================
   BASIC DATA
===================================================== */

let email = "";

let currentQuestion = 0;

let score = 0;

let answersGiven = [];


/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    /* -------------------------------------------------
       QUESTION 1
    ------------------------------------------------- */

    {

        terminal:
            "TERMINAL NO-01",

        text:
`WHERE DID IT ALL START?`,

        answers: [

            "BLACKSTONE",

            "DUSTHAVEN",

            "NOWHERE",

            "IN THE MOJAVE"

        ],

        correct:
            0

    },


    /* -------------------------------------------------
       QUESTION 2
    ------------------------------------------------- */

    {

        terminal:
            "TERMINAL NO-02",

        text:
`WHAT IS AN EMANATOR?`,

        answers: [

            "ONE WHO LEARNS TO CONTROL THEIR INNER SIN.",

            "ONE WHO REFUSES TO ACCEPT THEIR INNER SIN AND BECOMES OVERWHELMED BY IT, MAKING THEMSELVES A VESSEL OF THAT SIN.",

            "ONE WHO IS CHOSEN BY THE GALLANT ORDER.",

            "ONE WHO ABSORBS THE POWER OF ANOTHER EMANATOR."

        ],

        correct:
            1

    },


    /* -------------------------------------------------
       QUESTION 3
    ------------------------------------------------- */

    {

        terminal:
            "TERMINAL NO-03",

        text:
`WHO IS OBSERVER'S 9?`,

        answers: [

            "NO ONE",

            "I DON'T KNOW WHO HE IS",

            "THE NINTH",

            "THE LISTENER",

            "[ BLANK ]"

        ],

        /*
         * ALL ANSWERS ARE CORRECT.
         */

        correct:
            "ALL"

    },


    /* -------------------------------------------------
       QUESTION 4
    ------------------------------------------------- */

    {

        terminal:
            "TERMINAL NO-04",

        text:
`YOU WERE WARNED ABOUT IRON RIDGE.

YOU WERE TOLD THAT SOMETHING WAS WATCHING.

YOU WERE TOLD TO LEAVE.

BUT WHEN YOU ENTERED THE MINE,
YOU FOUND YOUR OWN NAMES WRITTEN ON THE WALL.

THE WRITING WAS OLD.

OLDER THAN THE WAR.

WHO WAS WAITING FOR YOU?`,

        answers: [

            "THE THING IN THE MINE",

            "THE ONE WHO WAS WATCHING",

            "THE THING THAT WAS ALREADY THERE",

            "I DON'T KNOW",

            "[ RECORD CORRUPTED ]"

        ],

        /*
         * Every answer is accepted here too.
         * Change this to a number if you want
         * only one answer to be correct.
         */

        correct:
            "ALL"

    }

];


/* =====================================================
   START
===================================================== */

function startTest() {

    const emailInput =
        document.getElementById(
            "email"
        );


    email =
        emailInput.value.trim();


    if (
        !email ||
        !email.includes("@")
    ) {

        document
            .getElementById(
                "emailError"
            )
            .classList
            .remove("hidden");

        return;

    }


    /*
     * Start music after the user
     * interacts with the page.
     */

    const music =
        document.getElementById(
            "backgroundMusic"
        );


    music.volume =
        0.12;


    music.play().catch(
        () => {}
    );


    document
        .getElementById("intro")
        .classList
        .add("hidden");


    document
        .getElementById("quiz")
        .classList
        .remove("hidden");


    showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    const q =
        questions[currentQuestion];


    document
        .getElementById("progress")
        .innerText =
        q.terminal;


    document
        .getElementById("questionText")
        .innerText =
        q.text;


    const answers =
        document.getElementById(
            "answers"
        );


    answers.innerHTML =
        "";


    q.answers.forEach(
        (answer, index) => {


            const button =
                document.createElement(
                    "button"
                );


            button.innerText =
                "[ " +
                answer +
                " ]";


            button.onclick =
                () =>
                answerQuestion(index);


            answers.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   ANSWER QUESTION
===================================================== */

function answerQuestion(index) {

    const q =
        questions[currentQuestion];


    const selectedAnswer =
        q.answers[index];


    answersGiven.push({

        question:
            currentQuestion + 1,

        answer:
            selectedAnswer

    });


    /*
     * Questions 3 and 4:
     * EVERYTHING is accepted.
     */

    if (
        q.correct === "ALL"
    ) {

        score++;

    }

    else if (
        index === q.correct
    ) {

        score++;

    }


    currentQuestion++;


    /* -----------------------------------------------
       QUESTION 2 → atmosphere starts changing
    ----------------------------------------------- */

    if (
        currentQuestion === 2
    ) {

        document.body.style.background =
            "#010201";


        document
            .getElementById("message")
            .innerHTML =

            `<p class="warning">
            ARCHIVE ACCESS: PARTIAL.
            </p>`;

    }


    /* -----------------------------------------------
       QUESTION 3 → corruption
    ----------------------------------------------- */

    if (
        currentQuestion === 3
    ) {

        document
            .getElementById("quiz")
            .classList
            .add("corruption");


        document
            .getElementById("message")
            .innerHTML =

            `<p class="warning">
            OBSERVER CONNECTION DETECTED.
            </p>`;

    }


    /* -----------------------------------------------
       QUESTION 4 → continue
    ----------------------------------------------- */

    if (
        currentQuestion >=
        questions.length
    ) {

        setTimeout(
            finishQuiz,
            1500
        );

    }

    else {

        setTimeout(
            showQuestion,
            900
        );

    }

}


/* =====================================================
   FINISH
===================================================== */

function finishQuiz() {

    document
        .getElementById("quiz")
        .classList
        .add("hidden");


    /*
     * 3/4 required.
     *
     * Because Q3 and Q4 are automatically
     * correct, the player can reach the
     * final if they answer Q1 or Q2 correctly.
     */

    if (
        score >= 3
    ) {

        document
            .getElementById("final")
            .classList
            .remove("hidden");


        typeFinalMessage();

    }

    else {

        document
            .getElementById("ending")
            .classList
            .remove("hidden");


        document
            .getElementById("endingTitle")
            .innerText =
            "ACCESS DENIED";


        document
            .getElementById("endingText")
            .innerText =

`INSUFFICIENT ARCHIVE KNOWLEDGE.

SCORE:
${score}/4

CONNECTION TERMINATED.`;

    }

}


/* =====================================================
   FINAL TYPING
===================================================== */

function typeFinalMessage() {

    const text =

`QUESTIONNAIRE COMPLETE.

...

THERE IS NO MORE MULTIPLE CHOICE.

TYPE YOUR ANSWER.

`;


    let i = 0;


    const element =
        document.getElementById(
            "typing"
        );


    function type() {

        if (
            i < text.length
        ) {

            element.textContent +=
                text.charAt(i);

            i++;


            setTimeout(
                type,
                40
            );

        }

    }


    type();

}


/* =====================================================
   SEND TO EMAIL
===================================================== */

async function submitFinal() {

    const finalAnswer =
        document
            .getElementById(
                "finalAnswer"
            )
            .value
            .trim();


    const status =
        document.getElementById(
            "sendStatus"
        );


    if (
        !finalAnswer
    ) {

        status.innerText =
            "ERROR: ANSWER REQUIRED.";

        status.style.color =
            "#ff4444";

        return;

    }


    // CASTERILL SECRET ROUTE
    if (finalAnswer.toLowerCase().trim() === "casterill") {
        status.innerText = "PRESIDENTIAL CLEARANCE ACCEPTED.";
        status.style.color = "#9cff9c";

        setTimeout(() => {
            window.location.href = "archives.html";
        }, 2500);

        return;
    }

    status.innerText =
        "TRANSMITTING...";

    status.style.color =
        "#568556";


    /*
     * SEND EVERYTHING TO FORMSUBMIT
     */

    const submission = {

        email:
            email,

        score:
            score + "/4",

        question_1:
            answersGiven[0]?.answer || "",

        question_2:
            answersGiven[1]?.answer || "",

        question_3:
            answersGiven[2]?.answer || "",

        question_4:
            answersGiven[3]?.answer || "",

        final_answer:
            finalAnswer,

        submitted_at:
            new Date()
                .toLocaleString()

    };


    try {

        const response =
            await fetch(

                "https://formsubmit.co/ajax/culoareanicolae@gmail.com",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            submission
                        )

                }

            );


        const result =
            await response.json();


        if (
            response.ok
        ) {

            document
                .getElementById("final")
                .classList
                .add("hidden");


            document
                .getElementById("ending")
                .classList
                .remove("hidden");


            document
                .getElementById("endingTitle")
                .innerText =

                "TRANSMISSION COMPLETE.";


            document
                .getElementById("endingText")
                .innerText =

`YOUR RESPONSE HAS BEEN ARCHIVED.

...

CONNECTION TERMINATED.`;


        }

        else {

            throw new Error(
                result.message ||
                "Transmission failed."
            );

        }

    }

    catch (error) {

        console.error(error);


        status.innerText =
            "TRANSMISSION FAILED.";


        status.style.color =
            "#ff4444";

    }

}

</script>
